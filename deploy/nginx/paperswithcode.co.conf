upstream pwc_production_backend {
    server unix:/srv/paperswithcode/environments/production/active/backend.sock;
}

map $request_method $pwc_production_mcp_method_allowed {
    default 0;
    GET 1;
    HEAD 1;
    POST 1;
    DELETE 1;
    OPTIONS 1;
}
map $http_accept $pwc_production_mcp_stream_present {
    default 0;
    "~*(?:^|,)\s*text/event-stream(?:(?!\bq\s*=)[^,])*(?:,|$)" 1;
}
map $http_accept $pwc_production_mcp_stream_q0 {
    default 0;
    "~*(?:^|,)\s*text/event-stream(?:\s*;[^,]*)?\bq\s*=\s*0(?:\.0*)?\s*(?:;[^,]*)?(?:,|$)" 1;
}
map $http_accept $pwc_production_mcp_stream_positive {
    default 0;
    "~*(?:^|,)\s*text/event-stream(?:\s*;[^,]*)?\bq\s*=\s*(?:1(?:\.0*)?|0?\.0*[1-9]\d*)\s*(?:;[^,]*)?(?:,|$)" 1;
}
map "$pwc_production_mcp_stream_positive:$pwc_production_mcp_stream_present:$pwc_production_mcp_stream_q0" $pwc_production_mcp_stream_signal {
    default 0;
    ~^1: 1;
    ~^0:1: 1;
}
map $http_accept $pwc_production_mcp_html_present {
    default 0;
    "~*(?:^|,)\s*text/html(?:(?!\bq\s*=)[^,])*(?:,|$)" 1;
}
map $http_accept $pwc_production_mcp_html_q0 {
    default 0;
    "~*(?:^|,)\s*text/html(?:\s*;[^,]*)?\bq\s*=\s*0(?:\.0*)?\s*(?:;[^,]*)?(?:,|$)" 1;
}
map $http_accept $pwc_production_mcp_html_positive {
    default 0;
    "~*(?:^|,)\s*text/html(?:\s*;[^,]*)?\bq\s*=\s*(?:1(?:\.0*)?|0?\.0*[1-9]\d*)\s*(?:;[^,]*)?(?:,|$)" 1;
}
map "$pwc_production_mcp_html_positive:$pwc_production_mcp_html_present:$pwc_production_mcp_html_q0" $pwc_production_mcp_html_signal {
    default 0;
    ~^1: 1;
    ~^0:1: 1;
}
log_format pwc_production_mcp '$time_iso8601 status=$status bytes=$body_bytes_sent request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paperswithcode.co;
    root /srv/paperswithcode/environments/production/active/release/frontend-dist;

    ssl_certificate /etc/letsencrypt/live/paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/paperswithcode_access.log;
    error_log /var/log/nginx/paperswithcode_error.log;
    client_max_body_size 50M;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc"; type="application/json", </docs/api>; rel="service-doc"; type="text/html", </health>; rel="status"; type="application/json"' always;

    location ~ "^/internal/(deployment-status|drain|undrain)$" {
        return 404;
    }
    location @production_mcp_protocol {
        rewrite ^/mcp/$ /mcp break;
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host paperswithcode.co;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        client_max_body_size 2m;
        client_body_timeout 10s;
        access_log /var/log/nginx/paperswithcode_mcp_access.log pwc_production_mcp;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept, MCP-Protocol-Version" always;
    }
    location = /mcp/health {
        proxy_pass http://127.0.0.1:8002/health;
        proxy_set_header Host paperswithcode.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        access_log /var/log/nginx/paperswithcode_mcp_access.log pwc_production_mcp;
        add_header Cache-Control "no-store" always;
    }
    location = /mcp {
        error_page 418 = @production_mcp_protocol;
        if ($pwc_production_mcp_method_allowed = 0) { return 405; }
        if ($request_method = POST) { return 418; }
        if ($request_method = DELETE) { return 418; }
        if ($request_method = OPTIONS) { return 418; }
        if ($http_mcp_protocol_version != "") { return 418; }
        if ($pwc_production_mcp_stream_signal) { return 418; }
        if ($pwc_production_mcp_html_signal = 0) { return 406; }
        client_max_body_size 2m;
        client_body_timeout 10s;
        try_files /index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Vary "Accept, MCP-Protocol-Version" always;
        add_header Allow "GET, HEAD, POST, DELETE, OPTIONS" always;
    }
    location = /mcp/ {
        error_page 418 = @production_mcp_protocol;
        if ($pwc_production_mcp_method_allowed = 0) { return 405; }
        if ($request_method = POST) { return 418; }
        if ($request_method = DELETE) { return 418; }
        if ($request_method = OPTIONS) { return 418; }
        if ($http_mcp_protocol_version != "") { return 418; }
        if ($pwc_production_mcp_stream_signal) { return 418; }
        if ($pwc_production_mcp_html_signal = 0) { return 406; }
        client_max_body_size 2m;
        client_body_timeout 10s;
        try_files /index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Vary "Accept, MCP-Protocol-Version" always;
        add_header Allow "GET, HEAD, POST, DELETE, OPTIONS" always;
    }
    location ^~ /mcp/ {
        return 404;
    }
    location ^~ /assets/ {
        try_files $uri @production_previous_asset;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location @production_previous_asset {
        root /srv/paperswithcode/environments/production/previous/frontend-dist;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc"; type="application/json", </docs/api>; rel="service-doc"; type="text/html", </health>; rel="status"; type="application/json"' always;
        expires 0;
    }
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
        try_files $uri =404;
    }
    location ~ "^/api/v1/chat/shares/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(/artifacts/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(preview|download/(png|pdf)))?$" {
        limit_except GET { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location /api/ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /health {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /.well-known/api-catalog {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location /thumbnails/ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /sitemap.xml {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /robots.txt {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ^~ /sitemaps/ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /papers/recent {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /papers/archive {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ~ "^/share/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        limit_except GET { deny all; }
        try_files /index.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ "^/papers/archive/[0-9]{4}(/[0-9]{2})?$" {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ~ ^/papers?/[^/]+ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = / {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ~ "^/(tasks|task|methods|benchmark|conferences|authors|organizations)/[^/]+(/[^/]+)?$" {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location @public_pages {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location / {
        try_files $uri @public_pages;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.paperswithcode.co;
    ssl_certificate /etc/letsencrypt/live/paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://paperswithcode.co$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name paperswithcode.co www.paperswithcode.co 167.235.148.241;
    return 301 https://paperswithcode.co$request_uri;
}

# Capability-authenticated gateway for production Modal sandboxes. The backend
# keeps these routes absent while production chat is disabled, so installing
# this host during preparation exposes no chat surface.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat-gateway.paperswithcode.co;

    ssl_certificate /etc/letsencrypt/live/chat-gateway.paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-gateway.paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/production_chat_gateway_access.log;
    error_log /var/log/nginx/production_chat_gateway_error.log;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 512k;

    location = /api/internal/chat-gateway/catalog {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /api/internal/chat-gateway/hf-catalog {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_read_timeout 15s;
    }
    location = /api/internal/chat-gateway/session-store {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /api/internal/chat-gateway/web-fetch {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
    location = /api/internal/chat-gateway/v1/messages {
        client_max_body_size 8m;
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_buffering off;
        proxy_read_timeout 190s;
    }
    location = /api/internal/chat-gateway/v1/responses {
        client_max_body_size 8m;
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_buffering off;
        proxy_read_timeout 190s;
    }

    location ^~ / {
        return 404;
    }
}

# TLS-only executor rendezvous. Authentication is signed and generation-bound;
# Source IP is available only to the invalid-attempt limiter, never authorization.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat-executor.paperswithcode.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/pwc-executor-production;
        default_type text/plain;
        try_files $uri =404;
    }


    ssl_certificate /etc/letsencrypt/live/chat-executor.paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-executor.paperswithcode.co/privkey.pem;
    ssl_protocols TLSv1.3;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log /var/log/nginx/production_chat_executor_error.log warn;

    location ~ "^/v1/generations/(?<pwc_executor_generation>[1-9][0-9]{0,19})/environment$" {
        rewrite ^ /v1/environment break;
        proxy_pass http://unix:/run/paperswithcode/production/$pwc_executor_generation/chat-executor-rendezvous.sock:;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-PWC-Network-Source $remote_addr;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_buffering off;
    }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat-executor.paperswithcode.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/pwc-executor-production;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ / { return 301 https://chat-executor.paperswithcode.co$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat-gateway.paperswithcode.co;
    return 301 https://chat-gateway.paperswithcode.co$request_uri;
}
