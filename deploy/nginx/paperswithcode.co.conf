upstream pwc_production_backend {
    server unix:/srv/paperswithcode/environments/production/active/backend.sock;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paperswithcode.co;
    root /srv/paperswithcode/environments/production/active/release/frontend-dist;

    ssl_certificate /etc/letsencrypt/live/paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/paperswithcode_access.log;
    error_log /var/log/nginx/paperswithcode_error.log;
    client_max_body_size 50M;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc"; type="application/json", </docs/api>; rel="service-doc"; type="text/html", </health>; rel="status"; type="application/json"' always;

    location ~ "^/internal/(deployment-status|drain|undrain)$" {
        return 404;
    }
    location ^~ /assets/ {
        try_files $uri @production_previous_asset;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location @production_previous_asset {
        root /srv/paperswithcode/environments/production/previous/frontend-dist;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </openapi.json>; rel="service-desc"; type="application/json", </docs/api>; rel="service-doc"; type="text/html", </health>; rel="status"; type="application/json"' always;
        expires 0;
    }
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
        try_files $uri =404;
    }
    location ~ "^/api/v1/chat/shares/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(/artifacts/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(preview|download/(png|pdf)))?$" {
        limit_except GET { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location /api/ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /health {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /.well-known/api-catalog {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location /thumbnails/ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /sitemap.xml {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /robots.txt {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ^~ /sitemaps/ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /papers/recent {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = /papers/archive {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ~ "^/share/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        limit_except GET { deny all; }
        try_files /index.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ "^/papers/archive/[0-9]{4}(/[0-9]{2})?$" {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ~ ^/papers?/[^/]+ {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location = / {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location ~ "^/(tasks|task|methods|benchmark|conferences|authors|organizations)/[^/]+(/[^/]+)?$" {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location @public_pages {
        proxy_pass http://pwc_production_backend;
        include proxy_params;
    }
    location / {
        try_files $uri @public_pages;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.paperswithcode.co;
    ssl_certificate /etc/letsencrypt/live/paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://paperswithcode.co$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name paperswithcode.co www.paperswithcode.co 167.235.148.241;
    return 301 https://paperswithcode.co$request_uri;
}

# Capability-authenticated gateway for production Modal sandboxes. The backend
# keeps these routes absent while production chat is disabled, so installing
# this host during preparation exposes no chat surface.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat-gateway.paperswithcode.co;

    ssl_certificate /etc/letsencrypt/live/chat-gateway.paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-gateway.paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/production_chat_gateway_access.log;
    error_log /var/log/nginx/production_chat_gateway_error.log;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 512k;

    location = /api/internal/chat-gateway/catalog {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /api/internal/chat-gateway/hf-catalog {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_read_timeout 15s;
    }
    location = /api/internal/chat-gateway/session-store {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /api/internal/chat-gateway/web-fetch {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
    location = /api/internal/chat-gateway/v1/messages {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_buffering off;
        proxy_read_timeout 190s;
    }
    location = /api/internal/chat-gateway/v1/responses {
        limit_except POST { deny all; }
        proxy_pass http://pwc_production_backend;
        include proxy_params;
        proxy_buffering off;
        proxy_read_timeout 190s;
    }

    location ^~ / {
        return 404;
    }
}

# TLS-only executor rendezvous. Authentication is signed and generation-bound;
# Source IP is available only to the invalid-attempt limiter, never authorization.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat-executor.paperswithcode.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/pwc-executor-production;
        default_type text/plain;
        try_files $uri =404;
    }


    ssl_certificate /etc/letsencrypt/live/chat-executor.paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-executor.paperswithcode.co/privkey.pem;
    ssl_protocols TLSv1.3;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log /var/log/nginx/production_chat_executor_error.log warn;

    location ~ "^/v1/generations/(?<pwc_executor_generation>[1-9][0-9]{0,19})/environment$" {
        rewrite ^ /v1/environment break;
        proxy_pass http://unix:/run/paperswithcode/production/$pwc_executor_generation/chat-executor-rendezvous.sock:;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-PWC-Network-Source $remote_addr;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_buffering off;
    }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat-executor.paperswithcode.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/pwc-executor-production;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ / { return 301 https://chat-executor.paperswithcode.co$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat-gateway.paperswithcode.co;
    return 301 https://chat-gateway.paperswithcode.co$request_uri;
}
