# Anonymous catalog limits share counters across nginx workers. Never trust a
# caller-supplied forwarding header as the identity for these counters.
map "$request_method:$uri" $pwc_staging_catalog_key {
    default "";
    ~^GET:/api/v1/(papers|tasks|datasets|evaluations)(/|$) $binary_remote_addr;
}
map "$request_method:$uri" $pwc_staging_catalog_search_key {
    default "";
    ~^GET:/api/v1/(papers|tasks|datasets|evaluations)/?$ $binary_remote_addr;
    ~^GET:/api/v1/papers/search(/feed)?/?$ $binary_remote_addr;
}
# The throttle body is fixed public text, independent of credentials. Reflect
# Origin only for that error so credentialed clients can read Retry-After.
# Successful and private responses retain the application's own CORS policy.
map $http_origin $pwc_staging_catalog_error_origin {
    default $http_origin;
    "" "*";
}
map $http_origin $pwc_staging_catalog_error_credentials {
    default "true";
    "" "";
}
limit_req_zone $pwc_staging_catalog_key zone=pwc_staging_catalog:10m rate=120r/m;
limit_req_zone $pwc_staging_catalog_search_key zone=pwc_staging_catalog_search:10m rate=60r/m;

upstream pwc_staging_backend {
    server unix:/srv/paperswithcode/environments/staging/active/backend.sock;
}

# Private bridge for the unprivileged MCP service. The stable loopback listener
# follows the active blue/green backend socket without exposing staging APIs.
server {
    listen 127.0.0.1:8011;
    server_name pwc-staging-mcp-api;
    access_log off;
    allow 127.0.0.1;
    deny all;

    location ~ "^/api/v1/(papers(?:/|$)|research/papers/|tasks(?:/|$)|methods(?:/|$)|datasets(?:/|$))" {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://pwc_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host staging.paperswithcode.co;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }

    location ~ ^/ {
        return 404;
    }
}

map $request_method $pwc_staging_mcp_method_allowed {
    default 0;
    GET 1;
    HEAD 1;
    POST 1;
    DELETE 1;
    OPTIONS 1;
}
map $http_accept $pwc_staging_mcp_stream_present {
    default 0;
    "~*(?:^|,)\s*text/event-stream(?:(?!\bq\s*=)[^,])*(?:,|$)" 1;
}
map $http_accept $pwc_staging_mcp_stream_q0 {
    default 0;
    "~*(?:^|,)\s*text/event-stream(?:\s*;[^,]*)?\bq\s*=\s*0(?:\.0*)?\s*(?:;[^,]*)?(?:,|$)" 1;
}
map $http_accept $pwc_staging_mcp_stream_positive {
    default 0;
    "~*(?:^|,)\s*text/event-stream(?:\s*;[^,]*)?\bq\s*=\s*(?:1(?:\.0*)?|0?\.0*[1-9]\d*)\s*(?:;[^,]*)?(?:,|$)" 1;
}
map "$pwc_staging_mcp_stream_positive:$pwc_staging_mcp_stream_present:$pwc_staging_mcp_stream_q0" $pwc_staging_mcp_stream_signal {
    default 0;
    ~^1: 1;
    ~^0:1: 1;
}
map $http_accept $pwc_staging_mcp_html_present {
    default 0;
    "~*(?:^|,)\s*text/html(?:(?!\bq\s*=)[^,])*(?:,|$)" 1;
}
map $http_accept $pwc_staging_mcp_html_q0 {
    default 0;
    "~*(?:^|,)\s*text/html(?:\s*;[^,]*)?\bq\s*=\s*0(?:\.0*)?\s*(?:;[^,]*)?(?:,|$)" 1;
}
map $http_accept $pwc_staging_mcp_html_positive {
    default 0;
    "~*(?:^|,)\s*text/html(?:\s*;[^,]*)?\bq\s*=\s*(?:1(?:\.0*)?|0?\.0*[1-9]\d*)\s*(?:;[^,]*)?(?:,|$)" 1;
}
map "$pwc_staging_mcp_html_positive:$pwc_staging_mcp_html_present:$pwc_staging_mcp_html_q0" $pwc_staging_mcp_html_signal {
    default 0;
    ~^1: 1;
    ~^0:1: 1;
}
log_format pwc_staging_mcp '$time_iso8601 status=$status bytes=$body_bytes_sent request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.paperswithcode.co;
    root /srv/paperswithcode/environments/staging/active/release/frontend-dist;

    ssl_certificate /etc/letsencrypt/live/staging.paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/staging_paperswithcode_access.log;
    error_log /var/log/nginx/staging_paperswithcode_error.log;
    client_max_body_size 50M;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/v1/openapi.json>; rel="service-desc"; type="application/json", </docs/api>; rel="service-doc"; type="text/html", </health>; rel="status"; type="application/json"' always;

    location ~ "^/internal/(deployment-status|drain|undrain)$" {
        return 404;
    }
    location @staging_mcp_protocol {
        rewrite ^/mcp/$ /mcp break;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host staging.paperswithcode.co;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        client_max_body_size 2m;
        client_body_timeout 10s;
        access_log /var/log/nginx/staging_paperswithcode_mcp_access.log pwc_staging_mcp;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept, MCP-Protocol-Version" always;
    }
    location = /mcp/health {
        proxy_pass http://127.0.0.1:8003/health;
        proxy_set_header Host staging.paperswithcode.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        access_log /var/log/nginx/staging_paperswithcode_mcp_access.log pwc_staging_mcp;
        add_header Cache-Control "no-store" always;
    }
    location = /mcp {
        error_page 418 = @staging_mcp_protocol;
        if ($pwc_staging_mcp_method_allowed = 0) { return 405; }
        if ($request_method = POST) { return 418; }
        if ($request_method = DELETE) { return 418; }
        if ($request_method = OPTIONS) { return 418; }
        if ($http_mcp_protocol_version != "") { return 418; }
        if ($pwc_staging_mcp_stream_signal) { return 418; }
        if ($pwc_staging_mcp_html_signal = 0) { return 406; }
        client_max_body_size 2m;
        client_body_timeout 10s;
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        try_files /index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Vary "Accept, MCP-Protocol-Version" always;
        add_header Allow "GET, HEAD, POST, DELETE, OPTIONS" always;
    }
    location = /mcp/ {
        error_page 418 = @staging_mcp_protocol;
        if ($pwc_staging_mcp_method_allowed = 0) { return 405; }
        if ($request_method = POST) { return 418; }
        if ($request_method = DELETE) { return 418; }
        if ($request_method = OPTIONS) { return 418; }
        if ($http_mcp_protocol_version != "") { return 418; }
        if ($pwc_staging_mcp_stream_signal) { return 418; }
        if ($pwc_staging_mcp_html_signal = 0) { return 406; }
        client_max_body_size 2m;
        client_body_timeout 10s;
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        try_files /index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Vary "Accept, MCP-Protocol-Version" always;
        add_header Allow "GET, HEAD, POST, DELETE, OPTIONS" always;
    }
    location ^~ /mcp/ {
        return 404;
    }
    location @public_api_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header Access-Control-Allow-Origin $pwc_staging_catalog_error_origin always;
        add_header Access-Control-Allow-Credentials $pwc_staging_catalog_error_credentials always;
        add_header Vary "Origin" always;
        add_header Access-Control-Expose-Headers "Retry-After" always;
        return 429 '{"detail":"API traffic limit exceeded. Retry with backoff."}';
    }
    location = /docs/api {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        try_files /index.html =404;
    }
    location = /docs/api/ {
        return 308 /docs/api$is_args$args;
    }
    location = /health {
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    # Public and read-only: this advertises only the production API surface.
    location = /.well-known/api-catalog {
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /api/v1/auth/hf/login {
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /api/v1/auth/hf/callback {
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /api/v1/auth/me {
        limit_except GET { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /api/v1/staging-access-request {
        limit_except POST { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /_staging_access_check {
        internal;
        proxy_pass http://pwc_staging_backend/api/v1/auth/staging-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include proxy_params;
    }
    location @staging_signin {
        return 302 https://$host/api/v1/auth/hf/login?return_to=$request_uri;
    }
    location @staging_forbidden {
        return 302 /request-access;
    }
    location ^~ /assets/ {
        try_files $uri @staging_previous_asset;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location @staging_previous_asset {
        root /srv/paperswithcode/environments/staging/previous/frontend-dist;
        try_files $uri =404;
    }
    location = /request-access {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/v1/openapi.json>; rel="service-desc"; type="application/json", </docs/api>; rel="service-doc"; type="text/html", </health>; rel="status"; type="application/json"' always;
        expires 0;
    }
    location /images/ {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        expires 30d;
        add_header Cache-Control "private, stale-while-revalidate=86400";
        try_files $uri =404;
    }
    location ~ "^/api/v1/chat/shares/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(/artifacts/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(preview|download/(png|pdf)))?$" {
        limit_except GET { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    # Remote curation workers authenticate with a per-job bearer token in the
    # FastAPI callback routes, so they must bypass the browser OAuth gate.
    location ~ "^/api/v1/admin/codex-curation/jobs/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(context|taxonomy|leaderboards|apply|complete)$" {
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_read_timeout 300s;
    }
    # SSE must reach browsers incrementally through nginx and the edge proxy.
    # Keep this exact route ahead of the buffered generic API location.
    location = /api/v1/chat/stream {
        limit_except POST { deny all; }
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 190s;
    }
    location /api/ {
        limit_req zone=pwc_staging_catalog burst=60 nodelay;
        limit_req zone=pwc_staging_catalog_search burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @public_api_rate_limited;
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location ~ ^/(docs|redoc|openapi.json) {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location /thumbnails/ {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /sitemap.xml {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    # Public even though the staging UI is role-gated: crawlers must receive
    # an explicit disallow policy instead of an OAuth redirect.
    location = /robots.txt {
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location ^~ /sitemaps/ {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /papers/recent {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = /papers/archive {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location ~ "^/share/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        limit_except GET { deny all; }
        try_files /index.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ "^/papers/archive/[0-9]{4}(/[0-9]{2})?$" {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location ~ ^/papers?/[^/]+ {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location = / {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location ~ "^/(tasks|task|methods|benchmark|conferences|authors|organizations)/[^/]+(/[^/]+)?$" {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location @staging_public_pages {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
    }
    location / {
        auth_request /_staging_access_check;
        error_page 401 = @staging_signin;
        error_page 403 = @staging_forbidden;
        try_files $uri @staging_public_pages;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.paperswithcode.co;
    return 301 https://staging.paperswithcode.co$request_uri;
}

# Capability-authenticated gateway for Modal sandboxes. This hostname exposes
# no browser, catalog, authentication, admin, or arbitrary proxy surface.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat-gateway-staging.paperswithcode.co;

    ssl_certificate /etc/letsencrypt/live/chat-gateway-staging.paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-gateway-staging.paperswithcode.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/staging_chat_gateway_access.log;
    error_log /var/log/nginx/staging_chat_gateway_error.log;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 512k;

    location = /api/internal/chat-gateway/catalog {
        limit_except POST { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /api/internal/chat-gateway/hf-catalog {
        limit_except POST { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_read_timeout 15s;
    }
    location = /api/internal/chat-gateway/session-store {
        limit_except POST { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /api/internal/chat-gateway/artifact-prepare {
        limit_except POST { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_read_timeout 75s;
    }
    location = /api/internal/chat-gateway/artifact-publish {
        limit_except POST { deny all; }
        client_max_body_size 32m;
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_request_buffering off;
        proxy_read_timeout 620s;
    }
    location = /api/internal/chat-gateway/web-fetch {
        limit_except POST { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
    location = /api/internal/chat-gateway/v1/messages {
        client_max_body_size 8m;
        limit_except POST { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_buffering off;
        proxy_read_timeout 190s;
    }
    location = /api/internal/chat-gateway/v1/responses {
        client_max_body_size 8m;
        limit_except POST { deny all; }
        proxy_pass http://pwc_staging_backend;
        include proxy_params;
        proxy_buffering off;
        proxy_read_timeout 190s;
    }

    location ^~ / {
        return 404;
    }
}

# TLS-only executor rendezvous for staging; see the production peer contract.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat-executor-staging.paperswithcode.co;

    ssl_certificate /etc/letsencrypt/live/chat-executor-staging.paperswithcode.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-executor-staging.paperswithcode.co/privkey.pem;
    ssl_protocols TLSv1.3;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log /var/log/nginx/staging_chat_executor_error.log warn;

    location ~ "^/v1/generations/(?<pwc_executor_generation>[1-9][0-9]{0,19})/environment$" {
        rewrite ^ /v1/environment break;
        proxy_pass http://unix:/run/paperswithcode/staging/$pwc_executor_generation/chat-executor-rendezvous.sock:;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-PWC-Network-Source $remote_addr;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_buffering off;
    }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat-executor-staging.paperswithcode.co;
    return 301 https://chat-executor-staging.paperswithcode.co$request_uri;
}

