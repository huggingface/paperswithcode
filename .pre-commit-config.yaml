repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.11.8
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
    -   id: gitleaks
-   repo: local
    hooks:
    -   id: backend-comments
        name: backend comment ratchet
        entry: python3 scripts/backend_comments.py check
        language: system
        pass_filenames: false
        files: ^(backend/.*\.py|backend/comment-baseline\.json|scripts/backend_comments\.py)$
