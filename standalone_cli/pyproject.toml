[project]
name = "pwc-cli"
version = "0.1.0"
description = "Read-only Papers With Code research CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
pwc = "pwc_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwc_cli"]
