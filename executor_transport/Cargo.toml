[package]
name = "pwc-persistent-executor-transport"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22.1"
clatter = { version = "=2.2.0", default-features = false, features = [
    "alloc",
    "getrandom",
    "use-25519",
    "use-aes-gcm",
    "use-rust-crypto-ml-kem",
    "use-sha",
] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
futures-util = "=0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
thiserror = "2"
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots", "url"] }
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
url = "=2.5.8"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
