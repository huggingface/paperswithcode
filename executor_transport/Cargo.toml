[package]
name = "pwc-persistent-executor-transport"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22.1"
clatter = { version = "=2.2.0", default-features = false, features = [
    "alloc",
    "getrandom",
    "use-25519",
    "use-aes-gcm",
    "use-rust-crypto-ml-kem",
    "use-sha",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
