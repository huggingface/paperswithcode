name: Sync chat CLI skill

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-chat-cli-skill
  cancel-in-progress: false


permissions: {}

jobs:
  sync:
    # The upstream skill becomes part of the chat system prompt, so a sync is
    # proposed as a pull request for review instead of being pushed to main.
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_REPOSITORY: huggingface/pwc-cli
      UPSTREAM_PATH: standalone_cli/SKILL.md
      DESTINATION: backend/chat_sandbox_worker/PWC_CLI_SKILL.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Fetch and validate skill
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_commit="$(
            gh api \
              "repos/${UPSTREAM_REPOSITORY}/commits?path=${UPSTREAM_PATH}&per_page=1" \
              --jq '.[0].sha'
          )"
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          upstream_url="https://raw.githubusercontent.com/${UPSTREAM_REPOSITORY}/${upstream_commit}/${UPSTREAM_PATH}"
          skill_temporary="${RUNNER_TEMP}/pwc-cli-SKILL.md"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --max-filesize 131072 \
            "$upstream_url" \
            --output "$skill_temporary"
          test "$(sed -n '1p' "$skill_temporary")" = "---"
          grep -qx 'name: pwc-cli' "$skill_temporary"
          grep -qE 'contains? no authentication' "$skill_temporary"

          if cmp -s "$skill_temporary" "$DESTINATION"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 0644 "$skill_temporary" "$DESTINATION"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"

      - name: Propose skill sync for review
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ steps.sync.outputs.upstream_commit }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/sync-pwc-cli-skill-${UPSTREAM_COMMIT:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "A review branch for ${UPSTREAM_COMMIT} already exists: ${branch}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add "$DESTINATION"
          git commit \
            -m "Sync chat CLI skill" \
            -m "Upstream skill: ${UPSTREAM_REPOSITORY}@${UPSTREAM_COMMIT}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Sync chat CLI skill from ${UPSTREAM_REPOSITORY}@${UPSTREAM_COMMIT:0:12}" \
            --body "Automated sync of \`${UPSTREAM_PATH}\` from ${UPSTREAM_REPOSITORY}@${UPSTREAM_COMMIT}.

          This text is appended verbatim to the chat system prompt (\`${DESTINATION}\`). Review the diff before merging; it reaches production with the next \`pwc-deploy\`."
