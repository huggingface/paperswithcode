name: Sync chat CLI skill

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-chat-cli-skill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_REPOSITORY: huggingface/pwc-cli
      UPSTREAM_PATH: standalone_cli/SKILL.md
      DESTINATION: backend/chat_sandbox_worker/PWC_CLI_SKILL.md
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch and validate skill
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_commit="$(
            gh api \
              "repos/${UPSTREAM_REPOSITORY}/commits?path=${UPSTREAM_PATH}&per_page=1" \
              --jq '.[0].sha'
          )"
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]
          upstream_url="https://raw.githubusercontent.com/${UPSTREAM_REPOSITORY}/${upstream_commit}/${UPSTREAM_PATH}"
          skill_temporary="${RUNNER_TEMP}/pwc-cli-SKILL.md"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --max-filesize 131072 \
            "$upstream_url" \
            --output "$skill_temporary"
          test "$(sed -n '1p' "$skill_temporary")" = "---"
          grep -qx 'name: pwc-cli' "$skill_temporary"
          grep -q '^Generated with `pwc v' "$skill_temporary"
          grep -q 'the parser is authoritative' "$skill_temporary"

          if cmp -s "$skill_temporary" "$DESTINATION"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 0644 "$skill_temporary" "$DESTINATION"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"

      - name: Commit skill sync
        if: steps.sync.outputs.changed == 'true'
        env:
          UPSTREAM_COMMIT: ${{ steps.sync.outputs.upstream_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DESTINATION"
          git commit \
            -m "Sync chat CLI skill" \
            -m "Upstream skill: ${UPSTREAM_REPOSITORY}@${UPSTREAM_COMMIT}"
          git pull --rebase origin main
          git push origin HEAD:main
