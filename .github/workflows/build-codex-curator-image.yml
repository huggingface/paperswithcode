name: Build Codex curator image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: jobs/Dockerfile.codex-curator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/paperswithcode-codex-curator:latest
            ghcr.io/${{ github.repository_owner }}/paperswithcode-codex-curator:${{ github.sha }}
