name: Cron - Link Papers by Task Keywords

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild auto tags (delete source='auto' rows first). Manual tags are preserved."
        required: false
        type: boolean
        default: false

concurrency:
  group: cron-link-papers-by-task-keywords
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    environment: vps-operations
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "$VPS_HOST" ] || [[ "$VPS_HOST" == *"://"* || "$VPS_HOST" == *"@"* || "$VPS_HOST" == *"/"* || "$VPS_HOST" =~ [[:space:]] ]]; then
            echo "VPS_HOST must be a bare hostname or IP address, without user, scheme, path, or whitespace."
            exit 1
          fi
          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/$VPS_HOST/22"; then
            echo "Cannot reach VPS_HOST on TCP port 22 from the GitHub runner."
            exit 1
          fi
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
            echo "Failed to scan VPS host key. Check VPS_HOST is a hostname/IP only and port 22 is reachable."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run link_papers_by_task_keywords on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GITHUB_EVENT_INPUTS_REBUILD: ${{ github.event.inputs.rebuild }}
        run: |
          REMOTE_COMMAND='sudo /usr/local/sbin/pwc-cron link_papers_by_task_keywords'
          if [ "${GITHUB_EVENT_INPUTS_REBUILD}" = "true" ]; then
            REMOTE_COMMAND="$REMOTE_COMMAND --rebuild"
          fi
          ssh -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "$REMOTE_COMMAND"
