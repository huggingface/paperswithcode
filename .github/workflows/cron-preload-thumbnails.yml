name: Cron - Preload Thumbnails

on:
  workflow_dispatch:
    inputs:
      priority:
        description: "Priority mode: visible, trending, task-top, method-top, recent, missing-all, or external-missing"
        required: false
        default: "recent"
        type: choice
        options:
          - visible
          - trending
          - task-top
          - method-top
          - recent
          - missing-all
          - external-missing
      limit:
        description: "Maximum candidate papers to process"
        required: false
        default: ""
      recent_days:
        description: "Only consider papers published within the last N days (priority=recent)"
        required: false
        default: ""
      per_task:
        description: "Top N papers per task (priority=task-top or visible)"
        required: false
        default: ""
      per_method:
        description: "Top N papers per method (priority=method-top or visible)"
        required: false
        default: ""
      trending_max_age_days:
        description: "Max paper age in days for priority=trending"
        required: false
        default: ""
      citation_top:
        description: "Top N papers by citation_count to include (priority=visible)"
        required: false
        default: ""
      trending_top:
        description: "Top N trending papers to include (priority=visible)"
        required: false
        default: ""
      newest_top:
        description: "Top N newest papers to include (priority=visible)"
        required: false
        default: ""
      after_id:
        description: "Only papers with id > AFTER_ID (priority=missing-all)"
        required: false
        default: ""
      before_id:
        description: "Only papers with id < BEFORE_ID (priority=missing-all)"
        required: false
        default: ""
      shard:
        description: "Process papers with id %% N == I, formatted I/N (priority=missing-all)"
        required: false
        default: ""
      missing_only:
        description: "Skip candidates already on local disk before processing"
        required: false
        default: "false"
      trust_local_cache:
        description: "Skip per-paper HF bucket exists() probes (safe if mirror is healthy)"
        required: false
        default: "false"
      dry_run:
        description: "Set to 'true' to skip uploads"
        required: false
        default: "false"
      refresh_existing:
        description: "Set to 'true' to regenerate and overwrite existing thumbnails"
        required: false
        default: "false"
      request_delay_seconds:
        description: "Optional delay between paper downloads"
        required: false
        default: ""

concurrency:
  group: cron-preload-thumbnails
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    environment: vps-operations
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "$VPS_HOST" ] || [[ "$VPS_HOST" == *"://"* || "$VPS_HOST" == *"@"* || "$VPS_HOST" == *"/"* || "$VPS_HOST" =~ [[:space:]] ]]; then
            echo "VPS_HOST must be a bare hostname or IP address, without user, scheme, path, or whitespace."
            exit 1
          fi
          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/$VPS_HOST/22"; then
            echo "Cannot reach VPS_HOST on TCP port 22 from the GitHub runner."
            exit 1
          fi
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
            echo "Failed to scan VPS host key. Check VPS_HOST is a hostname/IP only and port 22 is reachable."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run preload_thumbnails on VPS
        env:
          INPUT_PRIORITY: ${{ github.event.inputs.priority }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_RECENT_DAYS: ${{ github.event.inputs.recent_days }}
          INPUT_PER_TASK: ${{ github.event.inputs.per_task }}
          INPUT_PER_METHOD: ${{ github.event.inputs.per_method }}
          INPUT_TRENDING_MAX_AGE_DAYS: ${{ github.event.inputs.trending_max_age_days }}
          INPUT_CITATION_TOP: ${{ github.event.inputs.citation_top }}
          INPUT_TRENDING_TOP: ${{ github.event.inputs.trending_top }}
          INPUT_NEWEST_TOP: ${{ github.event.inputs.newest_top }}
          INPUT_AFTER_ID: ${{ github.event.inputs.after_id }}
          INPUT_BEFORE_ID: ${{ github.event.inputs.before_id }}
          INPUT_SHARD: ${{ github.event.inputs.shard }}
          INPUT_MISSING_ONLY: ${{ github.event.inputs.missing_only }}
          INPUT_TRUST_LOCAL_CACHE: ${{ github.event.inputs.trust_local_cache }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_REFRESH_EXISTING: ${{ github.event.inputs.refresh_existing }}
          INPUT_REQUEST_DELAY_SECONDS: ${{ github.event.inputs.request_delay_seconds }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Inputs are free-form strings and ssh hands the command to a remote
          # shell, so accept only each option's exact grammar and quote every
          # word. Never splice raw input into the remote command.
          set -eo pipefail
          args=(preload_thumbnails)
          add() {
            local flag="$1" value="$2" pattern="$3"
            [ -n "$value" ] || return 0
            if [[ ! "$value" =~ $pattern ]]; then
              echo "Invalid value for ${flag}: must match ${pattern}" >&2
              exit 2
            fi
            args+=("$flag" "$value")
          }
          INTEGER='^[0-9]{1,9}$'
          add --priority "${INPUT_PRIORITY}" '^(visible|trending|task-top|method-top|recent|missing-all|external-missing)$'
          add --limit "${INPUT_LIMIT}" "$INTEGER"
          add --recent-days "${INPUT_RECENT_DAYS}" "$INTEGER"
          add --per-task "${INPUT_PER_TASK}" "$INTEGER"
          add --per-method "${INPUT_PER_METHOD}" "$INTEGER"
          add --trending-max-age-days "${INPUT_TRENDING_MAX_AGE_DAYS}" "$INTEGER"
          add --citation-top "${INPUT_CITATION_TOP}" "$INTEGER"
          add --trending-top "${INPUT_TRENDING_TOP}" "$INTEGER"
          add --newest-top "${INPUT_NEWEST_TOP}" "$INTEGER"
          add --after-id "${INPUT_AFTER_ID}" "$INTEGER"
          add --before-id "${INPUT_BEFORE_ID}" "$INTEGER"
          add --shard "${INPUT_SHARD}" '^[0-9]{1,4}/[0-9]{1,4}$'
          add --request-delay-seconds "${INPUT_REQUEST_DELAY_SECONDS}" '^[0-9]{1,4}(\.[0-9]{1,3})?$'
          [ "${INPUT_MISSING_ONLY}" = "true" ] && args+=(--missing-only)
          [ "${INPUT_TRUST_LOCAL_CACHE}" = "true" ] && args+=(--trust-local-cache)
          [ "${INPUT_DRY_RUN}" = "true" ] && args+=(--dry-run)
          [ "${INPUT_REFRESH_EXISTING}" = "true" ] && args+=(--refresh-existing)
          ssh -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "sudo /usr/local/sbin/pwc-cron ${args[*]@Q}"
