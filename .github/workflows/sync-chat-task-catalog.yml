name: Sync chat task catalog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-chat-task-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DESTINATION: backend/chat_sandbox_worker/TASK_CATALOG.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Prepare empty local environment file
        run: install -m 0600 /dev/null backend/keys.env

      - name: Render current public task taxonomy
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 --env-file backend/keys.env \
            python -m backend.chat_sandbox_worker.sync_task_catalog
          uv run --no-project --python 3.12 --env-file backend/keys.env \
            python -m backend.chat_sandbox_worker.sync_task_catalog --check
          if git diff --quiet -- "$DESTINATION"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push catalog fallback snapshot
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DESTINATION"
          git commit -m "Sync chat task catalog"
          catalog_before="$(git hash-object "$DESTINATION")"
          git pull --rebase origin main
          catalog_after="$(git hash-object "$DESTINATION")"
          test "$catalog_before" = "$catalog_after"
          git push origin HEAD:main
