name: Release profiles

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/release-profiles.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-profile:
    strategy:
      matrix:
        profile: [production, staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        if: matrix.profile == 'production'
        working-directory: frontend
      - run: npm run typecheck
        if: matrix.profile == 'production'
        working-directory: frontend
      - run: npm run build -- --mode ${{ matrix.profile }}
        working-directory: frontend
      - name: Validate generated feature manifest
        working-directory: frontend
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          node -e '
            const f=require("./dist/features.json");
            const expected=process.env.PROFILE==="staging";
            if (f.chat !== expected) process.exit(1);
          '
          ! grep -q '/src/main.tsx' dist/index.html
