name: Backup - Postgres to HF Bucket

on:
  workflow_dispatch: {}

concurrency:
  group: backup-postgres-to-hf-bucket
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "$VPS_HOST" ] || [[ "$VPS_HOST" == *"://"* || "$VPS_HOST" == *"@"* || "$VPS_HOST" == *"/"* || "$VPS_HOST" =~ [[:space:]] ]]; then
            echo "VPS_HOST must be a bare hostname or IP address, without user, scheme, path, or whitespace."
            exit 1
          fi
          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/$VPS_HOST/22"; then
            echo "Cannot reach VPS_HOST on TCP port 22 from the GitHub runner."
            exit 1
          fi
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
            echo "Failed to scan VPS host key. Check VPS_HOST is a hostname/IP only and port 22 is reachable."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run Postgres backup on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              'set -euo pipefail
               systemctl start pwc-postgres-backup.service
               service_result="$(systemctl show pwc-postgres-backup.service --property=Result --value)"
               systemctl status pwc-postgres-backup.service --no-pager || true
               systemctl status pwc-postgres-backup.timer --no-pager || true
               journalctl -u pwc-postgres-backup.service -n 120 --no-pager
               if [ "$service_result" != "success" ]; then
                 echo "Backup service result was: $service_result"
                 exit 1
               fi'
