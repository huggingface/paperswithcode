name: Hourly application smoke

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}


concurrency:
  group: hourly-application-smoke
  cancel-in-progress: false

permissions: {}

jobs:
  smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Production public responses and staging health
        run: |
          python deploy/smoke_test.py \
            --environment production \
            --base-url https://paperswithcode.co \
            --monitor-subset
          python deploy/smoke_test.py \
            --environment staging \
            --base-url https://staging.paperswithcode.co \
            --monitor-subset
