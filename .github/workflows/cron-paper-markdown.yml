name: Cron - Paper Markdown Backfill

on:
  workflow_dispatch:
    inputs:
      full:
        description: Reconcile the full catalog and use the backfill lane
        required: false
        type: boolean
        default: false
      dry_run:
        description: Plan copies and OCR Jobs without writing or launching
        required: false
        type: boolean
        default: false

concurrency:
  group: cron-paper-markdown
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    environment: vps-operations
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "$VPS_HOST" ] || [[ "$VPS_HOST" == *"://"* || "$VPS_HOST" == *"@"* || "$VPS_HOST" == *"/"* || "$VPS_HOST" =~ [[:space:]] ]]; then
            echo "VPS_HOST must be a bare hostname or IP address."
            exit 1
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run paper Markdown reconciliation on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL_PAUSED: ${{ vars.PAPER_MARKDOWN_BACKFILL_PAUSED }}
        run: |
          if ! ssh -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "sudo /usr/local/sbin/pwc-cron status | grep -q 'paper_markdown_backfill'"; then
            echo "paper_markdown_backfill is not activated in the production CRON allowlist"
            exit 0
          fi
          REMOTE_COMMAND="sudo /usr/local/sbin/pwc-cron paper_markdown_backfill"
          BACKFILL_COMMAND="$REMOTE_COMMAND --full"
          if [ "$INPUT_DRY_RUN" != "true" ]; then
            REMOTE_COMMAND="$REMOTE_COMMAND --execute --confirm"
            if [ "$BACKFILL_PAUSED" != "true" ]; then
              BACKFILL_COMMAND="$BACKFILL_COMMAND --execute --confirm"
            fi
          fi
          ssh -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" "$REMOTE_COMMAND"
          if [ "$INPUT_FULL" = "true" ]; then
            if [ "$BACKFILL_PAUSED" = "true" ]; then
              echo "Scheduled full backfill dispatch is paused; running reconciliation dry."
            fi
            ssh -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" "$BACKFILL_COMMAND"
          fi
