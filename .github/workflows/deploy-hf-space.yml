name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/scripts/deploy_hf_space.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-hf-space.yml"

  workflow_dispatch:
    inputs:
      space:
        description: "Target Hugging Face Space repo id"
        required: true
        default: "huggingface/paperswithcode"
      api_url:
        description: "Backend API origin baked into the Space build"
        required: true
        default: "https://paperswithcode.co"

permissions:
  contents: read

concurrency:
  group: deploy-hf-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPACE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.space || 'huggingface/paperswithcode' }}
      API_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_url || 'https://paperswithcode.co' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Python dependencies
        run: uv sync

      - name: Deploy Space
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN repository secret is required to deploy the Hugging Face Space"
            exit 1
          fi

          uv run python .github/workflows/scripts/deploy_hf_space.py \
            --space "$SPACE_ID" \
            --api-url "$API_URL" \
            --skip-restore
