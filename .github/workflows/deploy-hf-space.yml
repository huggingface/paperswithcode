name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/scripts/deploy_hf_space.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-hf-space.yml"

  workflow_dispatch:
    inputs:
      space:
        description: "Target Hugging Face Space repo id"
        required: true
        default: "huggingface/paperswithcode"
      api_url:
        description: "Backend API origin baked into the Space build"
        required: true
        default: "https://paperswithcode.co"

permissions:
  contents: read

concurrency:
  group: deploy-hf-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPACE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.space || 'huggingface/paperswithcode' }}
      API_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_url || 'https://paperswithcode.co' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Python dependencies
        run: uv sync

      - name: Validate inputs
        run: |
          if ! echo "$SPACE_ID" | grep -qE '^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+$'; then
            echo "::error::Invalid space format. Expected: org/repo-name"
            exit 1
          fi
          if ! echo "$API_URL" | grep -qE '^https://[a-zA-Z0-9.-]+(:[0-9]+)?(/.*)?$'; then
            echo "::error::Invalid API URL. Must be HTTPS URL"
            exit 1
          fi

      - name: Deploy Space
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN repository secret is required to deploy the Hugging Face Space"
            exit 1
          fi

          uv run python .github/workflows/scripts/deploy_hf_space.py \
            --space "$SPACE_ID" \
            --api-url "$API_URL" \
            --skip-restore
