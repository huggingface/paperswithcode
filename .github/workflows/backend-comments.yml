name: Backend comment ratchet

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/backend_comments.py"
      - ".github/workflows/backend-comments.yml"
  push:
    branches: [main]

permissions: {}

jobs:
  backend-comments:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 scripts/backend_comments.py check
