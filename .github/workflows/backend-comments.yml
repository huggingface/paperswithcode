name: Backend comment ratchet

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/backend_comments.py"
      - ".github/workflows/backend-comments.yml"
  push:
    branches: [main]

permissions: {}

jobs:
  backend-comments:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/backend_comments.py check
