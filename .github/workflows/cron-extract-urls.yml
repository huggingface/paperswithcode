name: Cron - Extract URLs

on:
  # Hourly schedule paused on 2026-07-13 to avoid Modal cost spikes.
  # Restore this block when URL extraction should run automatically again:
  #
  # schedule:
  #   - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum papers to process
        required: false
        default: "100"
      persist:
        description: Persist validated URL findings to production
        required: false
        type: boolean
        default: false

concurrency:
  group: cron-extract-urls
  cancel-in-progress: false


permissions: {}

jobs:
  select:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "$VPS_HOST" ] || [[ "$VPS_HOST" == *"://"* || "$VPS_HOST" == *"@"* || "$VPS_HOST" == *"/"* || "$VPS_HOST" =~ [[:space:]] ]]; then
            echo "VPS_HOST must be a bare hostname or IP address, without user, scheme, path, or whitespace."
            exit 1
          fi
          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/$VPS_HOST/22"; then
            echo "Cannot reach VPS_HOST on TCP port 22 from the GitHub runner."
            exit 1
          fi
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
            echo "Failed to scan VPS host key. Check VPS_HOST is a hostname/IP only and port 22 is reachable."
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Select priority candidates on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          REQUESTED_LIMIT: ${{ inputs.limit || '100' }}
        run: |
          if ! [[ "$REQUESTED_LIMIT" =~ ^[0-9]+$ ]] || (( REQUESTED_LIMIT < 1 || REQUESTED_LIMIT > 100 )); then
            echo "limit must be an integer between 1 and 100"
            exit 1
          fi
          ssh -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" \
            "sudo /usr/local/sbin/pwc-cron extract_urls_select --limit $REQUESTED_LIMIT" \
            > candidates.json
          python -m json.tool candidates.json > /dev/null

      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: url-candidates
          path: candidates.json
          retention-days: 1

  discover:
    permissions:
      contents: read
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      URL_EXTRACTION_MODAL_SECRET: url-extraction-deepseek-v4-flash-deepinfra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Download candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: url-candidates

      - name: Deploy current Modal agent
        run: uv run modal deploy url_extraction_agent/modal_app.py

      - name: Run one Modal agent per paper
        run: |
          uv run python -m url_extraction_agent.runner \
            --input candidates.json \
            --output results.json

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: url-results
          path: results.json
          if-no-files-found: error
          retention-days: 7

  persist:
    permissions: {}
    needs: discover
    if: ${{ inputs.persist == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download result artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: url-results

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "$VPS_HOST" ] || [[ "$VPS_HOST" == *"://"* || "$VPS_HOST" == *"@"* || "$VPS_HOST" == *"/"* || "$VPS_HOST" =~ [[:space:]] ]]; then
            echo "VPS_HOST must be a bare hostname or IP address."
            exit 1
          fi
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Persist validated results on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          python -m json.tool results.json > /dev/null
          set +e
          ssh -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" \
            'sudo /usr/local/sbin/pwc-cron extract_urls_persist --input -' \
            < results.json > persist-results.json 2> persist-stderr.log
          persist_exit=$?

          if [ ! -s persist-results.json ]; then
            echo "Persist command produced no JSON stdout. stderr follows:"
            cat persist-stderr.log
            exit 1
          fi

          python -m json.tool persist-results.json
          json_exit=$?
          if [ "$json_exit" -ne 0 ]; then
            echo "Persist command produced invalid JSON stdout. stderr follows:"
            cat persist-stderr.log
            exit "$json_exit"
          fi

          if [ "$persist_exit" -ne 0 ]; then
            echo "Persist command exited with status $persist_exit after writing parseable JSON. stderr follows:"
            cat persist-stderr.log
            exit "$persist_exit"
          fi

      - name: Upload persist debug artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: url-persist-debug
          path: |
            results.json
            persist-results.json
            persist-stderr.log
          if-no-files-found: ignore
          retention-days: 3
