name: Test Database System

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/config.py"
      - "backend/database/**"
      - "backend/models/**"
      - "backend/services/**"
      - "backend/tests/conftest.py"
      - "backend/tests/test_database_guard.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-database.yml"

  pull_request:
    branches: [main]
    paths:
      - "backend/config.py"
      - "backend/database/**"
      - "backend/models/**"
      - "backend/services/**"
      - "backend/tests/conftest.py"
      - "backend/tests/test_database_guard.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-database.yml"

  workflow_dispatch:

permissions: {}

jobs:
  test-database:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: paperswithcode_hf
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PWC_DB_HOST: localhost
      PWC_DB_PORT: 5432
      PWC_DB_NAME: paperswithcode_hf
      PWC_DB_USER: postgres
      PWC_DB_PASSWORD: postgres
      # Disposable service database: lets backend/tests/conftest.py allow
      # PostgreSQL connections from pytest.
      PWC_TEST_DATABASE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Test the live-database guard
        run: uv run pytest backend/tests/test_database_guard.py -q

      - name: Test current database layer
        run: |
          uv run python - <<'PY'
          from datetime import date

          from sqlalchemy import text

          from backend.database.connection import create_tables, drop_tables, get_engine
          from backend.models.database import Paper

          drop_tables(confirm_database="paperswithcode_hf")
          create_tables()

          engine = get_engine()
          with engine.begin() as conn:
              conn.execute(text("SELECT 1"))

          from backend.database.connection import db_manager

          with db_manager.session_local() as session:
              paper = Paper(
                  title="CI database smoke test",
                  abstract="Verifies the current SQLAlchemy database layer.",
                  arxiv_id="2605.00001",
                  version="v1",
                  is_latest_version=True,
                  date_published=date(2026, 5, 5),
              )
              session.add(paper)
              session.commit()

              count = session.query(Paper).filter(Paper.arxiv_id == "2605.00001").count()
              assert count == 1

          drop_tables(confirm_database="paperswithcode_hf")
          print("Database smoke test passed")
          PY
