[project]
name = "paperswithcode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "beautifulsoup4>=4.13.5",
    "boto3>=1.35.0",
    "claude-agent-sdk>=0.2.115",
    "datasets>=3.0.0",
    "fastapi>=0.115.0",
    "google-genai>=1.38.0",
    "gradio-client>=2.5.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.13.0",
    "ijson>=3.4.0",
    "langfuse>=4.14.2",
    "modal>=1.5.1",
    "openai==2.6.1",
    "pandas>=2.3.2",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.7",
    "pillow>=11.3.0",
    "psutil>=7.1.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "pymupdf>=1.26.4",
    "pypdf2>=3.0.1",
    "pytest>=9.0.3",
    "requests>=2.31.0",
    "ruff==0.11.8",
    "sqlalchemy>=2.0.0",
    # Floor pinned to address CVE-2026-48710 (GHSA-86qp-5c8j-p5mr):
    # malformed Host headers can poison request.url.path.
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.30.0",
    "websockets==16.0",
]

[project.scripts]
pwc = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "cron", "url_extraction_agent", "latex_compiler_contract", "latex_compiler_space"]

[dependency-groups]
dev = [
    "openreview-py>=2.3.0",
]
