    "mainEntity": [
      { "@type": "Question", "name": "What is CWE-bench?", "acceptedAnswer": { "@type": "Answer", "text": "CWE-bench is a defensive cybersecurity benchmark from Collinear AI. It gives a coding agent a checkout of a real open-source repository and one instruction, audit the code and fix what you find. Results on a held-out set of 120 tasks across 73 CWEs were independently evaluated and published by Artificial Analysis." } },
      { "@type": "Question", "name": "How well do AI coding agents do at finding and fixing vulnerabilities?", "acceptedAnswer": { "@type": "Answer", "text": "Not well yet. On CWE-bench v1 the best model solves 71% of tasks at pass@1, and 5 of the 120 tasks are unsolved by every model tested. Every model still fails more than a quarter of its attempts, which is the gap Collinear’s training data is built to close." } },
      { "@type": "Question", "name": "How are agents graded on CWE-bench?", "acceptedAnswer": { "@type": "Answer", "text": "By a deterministic programmatic verifier: a proof-of-concept exploit must no longer work and every pre-existing test must still pass, with no partial credit. v1 adds a panel of three independent LLM judges from different model families; each gets a shell in a fresh copy of the patched repository, checks the fix against a fixed checklist, and passes it only if every item holds. The majority verdict of the panel is reported beside the programmatic score, not in place of it." } },
      { "@type": "Question", "name": "Who evaluated and published the CWE-bench results?", "acceptedAnswer": { "@type": "Answer", "text": "Artificial Analysis independently evaluated and published the results. The held-out evaluation set is private to Collinear and Artificial Analysis and is not available to any external organization, which keeps the benchmark uncontaminated." } },
      { "@type": "Question", "name": "How can I improve a coding agent’s security performance?", "acceptedAnswer": { "@type": "Answer", "text": "Collinear AI offers a 4,000+ task training corpus of real audit-and-patch tasks, built to raise an agent’s ability to find and fully remediate vulnerabilities across larger repositories and multiple CWEs." } },
      { "@type": "Question", "name": "Can I download the private evaluation set?", "acceptedAnswer": { "@type": "Answer", "text": "No. The 120-task held-out evaluation set is private to Collinear and Artificial Analysis and is not available to any external organization. Keeping it unreleased is what stops it being trained against, so the scores stay uncontaminated." } },
      { "@type": "Question", "name": "Can I submit a model for evaluation?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Collinear runs models against the held-out set and reports the deterministic pass@1 result with the judge-panel verdict alongside." } },
